name: Agent system prompt tests

on:
  workflow_dispatch:
  push:
    branches:
      - WenPaul/ci-agent-system-prompts
  pull_request:
    paths:
      - 'src-tauri/src/agents/system_prompts.rs'
      - 'src-tauri/src/agents/zcode.rs'
      - 'src-tauri/src/agents/discovery.rs'
      - 'src/i18n/agentSystemPrompts.ts'
      - 'tests/i18n.test.ts'
      - '.github/workflows/agent-system-prompt-tests.yml'

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare frontend placeholder
        run: |
          mkdir -p dist
          printf '<!doctype html><html><body></body></html>' > dist/index.html
      - name: Run system prompt tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin cpa-gui system_prompts -- --nocapture

  i18n-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run i18n tests
        run: bun test tests/i18n.test.ts